services:
  emqx:
    image: emqx/emqx:5.8.0
    ports:
      - "1883:1883"
      - "18083:18083"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iot_voice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securepassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  livekit:
    image: livekit/livekit-server:latest
    command: --dev
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      - livekit
      - postgres
    ports:
      - "8000:8000"

  voice-agent:
    build:
      context: .
      dockerfile: Dockerfile
    command: python agent.py start
    env_file: .env
    depends_on:
      - livekit
      - emqx
    restart: unless-stopped

volumes:
  postgres-data:
